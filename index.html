<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rueda de la Fortuna</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px 10px;
      background-color: #f4f4f9;
    }

    #captura-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
    }

    h1 {
      margin: 0 0 15px 0;
      font-size: 22px;
      line-height: 1.25;
      text-align: center;
      color: #2c3e50;
    }

    .rueda-container {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 10px auto;
    }

    .flecha {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;

      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid #e74c3c;

      z-index: 10;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.25));
    }

    canvas {
      display: block;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);

      transform: rotate(0deg);
      transform-origin: center center;
      will-change: transform;
    }

    .btn-girar {
      margin-top: 25px;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #27ae60;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 3px 7px rgba(0,0,0,0.15);
    }

    .btn-girar:hover:not(:disabled) {
      background-color: #219653;
    }

    .btn-girar:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn-girar:disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
    }

    #resultado-container {
      margin-top: 20px;
      text-align: center;
      display: none;
      background: #ffffff;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;

      animation: aparecer 0.4s ease-out;
    }

    #textoResultado {
      margin: 0;
      color: #2c3e50;
      font-size: 20px;
    }

    #accion-container {
      display: none;
      margin-top: 15px;
      width: 100%;
      max-width: 320px;

      animation: aparecer 0.4s ease-out;
    }

    .btn-compartir {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      background-color: #25d366;
      color: #ffffff;

      border: none;
      padding: 14px 18px;
      border-radius: 8px;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;
      width: 100%;

      box-shadow: 0 2px 6px rgba(0,0,0,0.15);

      transition: background 0.2s, transform 0.1s;
    }

    .btn-compartir:hover {
      background-color: #20bd5a;
    }

    .btn-compartir:active {
      transform: scale(0.98);
    }

    .btn-compartir:disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
    }

    .btn-compartir svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    #notificacion-copiado {
      display: none;
      margin-top: 10px;
      font-size: 13px;
      color: #27ae60;
      font-weight: bold;
      text-align: center;
      line-height: 1.4;
    }

    /* =========================================================
       VERSIÓN
       ========================================================= */

    #version {
      position: fixed;
      left: 8px;
      bottom: 6px;
      font-size: 11px;
      color: #95a5a6;
      opacity: 0.7;
      pointer-events: none;
      user-select: none;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 350px) {
      .rueda-container,
      canvas {
        width: 290px;
        height: 290px;
      }
    }
  </style>
</head>

<body>

  <div id="captura-area">

    <h1>Gira la rueda de la fortuna de Laura</h1>

    <div class="rueda-container">
      <div class="flecha"></div>
      <canvas id="canvasRueda" width="320" height="320"></canvas>
    </div>

    <div id="resultado-container">
      <h2 id="textoResultado"></h2>
    </div>

  </div>

  <button id="btnGirar" class="btn-girar" onclick="girarRueda()">
    GIRAR
  </button>

  <div id="accion-container">

    <button id="btnEnviar" class="btn-compartir" onclick="enviarResultado">

      <svg viewBox="0 0 24 24">
        <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2m8 3a5 5 0 0 0-5 5a5 5 0 0 0 5 5a5 5 0 0 0 5-5a5 5 0 0 0-5-5m0 2a3 3 0 0 1 3 3a3 3 0 0 1-3 3a3 3 0 0 1-3-3a3 3 0 0 1 3-3Z"/>
      </svg>

      Enviar resultado a Laura

    </button>

    <div id="notificacion-copiado">
      ¡Imagen copiada! Pegala en el chat de WhatsApp.
    </div>

  </div>

  <!-- Versión visible -->
  <div id="version">v2.0</div>


  <!-- html2canvas -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
    defer>
  </script>


  <script>

    /* =========================================================
       CONFIGURACIÓN
       ========================================================= */

    const NUMERO_LAURA = "5491160140422";

    const PREMIOS = [
      "Premio 1",
      "Premio 2",
      "Premio 3",
      "Premio 4",
      "Premio 5",
      "Premio 6",
      "Premio 7",
      "Premio 8",
      "Premio 9",
      "Premio 10"
    ];

    const COLORES = [
      "#f39c12",
      "#e74c3c",
      "#9b59b6",
      "#3498db",
      "#2ecc71",
      "#1abc9c",
      "#d35400",
      "#c0392b",
      "#8e44ad",
      "#16a085"
    ];

    /*
     * Premio 5 = índice 4.
     *
     * Sigue siendo visible en la rueda,
     * pero nunca puede ser seleccionado.
     */

    const PREMIO_EXCLUIDO = 4;


    /* =========================================================
       VARIABLES
       ========================================================= */

    let canvas;
    let ctx;

    const cantidadPremios = PREMIOS.length;

    const anguloSector =
      (2 * Math.PI) / cantidadPremios;

    const gradosSector =
      360 / cantidadPremios;

    let rotacionActual = 0;

    let girando = false;

    let blobCapturado = null;

    let ultimoResultado = null;


    /* =========================================================
       INICIALIZACIÓN
       ========================================================= */

    function inicializarRueda() {

      canvas =
        document.getElementById("canvasRueda");

      if (!canvas) {
        return;
      }

      ctx =
        canvas.getContext("2d");

      dibujarRueda();
    }


    /* =========================================================
       DIBUJAR RUEDA
       ========================================================= */

    function dibujarRueda() {

      if (!ctx) {
        return;
      }

      const centroX =
        canvas.width / 2;

      const centroY =
        canvas.height / 2;

      const radio =
        canvas.width / 2;

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      for (
        let i = 0;
        i < cantidadPremios;
        i++
      ) {

        const inicio =
          i * anguloSector;

        const fin =
          inicio + anguloSector;


        /* Sector */

        ctx.beginPath();

        ctx.moveTo(
          centroX,
          centroY
        );

        ctx.arc(
          centroX,
          centroY,
          radio,
          inicio,
          fin
        );

        ctx.closePath();

        ctx.fillStyle =
          COLORES[
            i % COLORES.length
          ];

        ctx.fill();


        /* Separadores */

        ctx.lineWidth = 2;

        ctx.strokeStyle = "#ffffff";

        ctx.stroke();


        /* Texto */

        ctx.save();

        ctx.translate(
          centroX,
          centroY
        );

        ctx.rotate(
          inicio +
          anguloSector / 2
        );

        ctx.textAlign = "right";

        ctx.textBaseline = "middle";

        ctx.fillStyle = "#ffffff";

        ctx.font =
          "bold 13px Arial";

        ctx.fillText(
          PREMIOS[i],
          radio - 15,
          0
        );

        ctx.restore();
      }
    }


    /* =========================================================
       ELEGIR GANADOR
       ========================================================= */

    function elegirGanador() {

      const premiosDisponibles = [];


      /*
       * Todos los premios participan
       * excepto Premio 5.
       */

      for (
        let i = 0;
        i < cantidadPremios;
        i++
      ) {

        if (i !== PREMIO_EXCLUIDO) {

          premiosDisponibles.push(i);
        }
      }


      const posicionAleatoria =
        Math.floor(
          Math.random() *
          premiosDisponibles.length
        );


      return premiosDisponibles[
        posicionAleatoria
      ];
    }


    /* =========================================================
       CALCULAR ROTACIÓN
       ========================================================= */

    function calcularRotacionParaPremio(
      indiceGanador
    ) {

      const centroSector =
        indiceGanador *
        gradosSector +
        gradosSector / 2;


      /*
       * Variación dentro del sector.
       *
       * Nunca llega cerca de las líneas
       * divisorias.
       */

      const variacion =
        (Math.random() - 0.5) *
        (gradosSector * 0.45);


      const objetivo =
        270 -
        centroSector +
        variacion;


      const rotacionNormalizada =
        (
          (rotacionActual % 360) +
          360
        ) % 360;


      let diferencia =
        objetivo -
        rotacionNormalizada;


      diferencia =
        (
          (diferencia % 360) +
          360
        ) % 360;


      const vueltasCompletas = 5;


      return (
        vueltasCompletas * 360 +
        diferencia
      );
    }


    /* =========================================================
       GIRAR
       ========================================================= */

    function girarRueda() {

      if (girando) {
        return;
      }

      girando = true;

      blobCapturado = null;

      ultimoResultado = null;


      const botonGirar =
        document.getElementById(
          "btnGirar"
        );

      botonGirar.disabled = true;


      document.getElementById(
        "resultado-container"
      ).style.display = "none";


      document.getElementById(
        "accion-container"
      ).style.display = "none";


      document.getElementById(
        "notificacion-copiado"
      ).style.display = "none";


      /*
       * Elegir ganador.
       *
       * Premio 5 nunca es seleccionado.
       */

      const indiceGanador =
        elegirGanador();


      ultimoResultado =
        PREMIOS[indiceGanador];


      const rotacion =
        calcularRotacionParaPremio(
          indiceGanador
        );


      rotacionActual += rotacion;


      const duracion = 4500;


      canvas.style.transition =
        `transform ${duracion}ms cubic-bezier(0.12, 0.8, 0.18, 1)`;


      canvas.style.transform =
        `rotate(${rotacionActual}deg)`;


      setTimeout(() => {

        girando = false;

        botonGirar.disabled = false;

        mostrarResultado(
          ultimoResultado
        );

      }, duracion + 100);
    }


    /* =========================================================
       RESULTADO
       ========================================================= */

    function mostrarResultado(
      premio
    ) {

      const texto =
        `¡Obtuviste el ${premio.toLowerCase()}!`;


      document.getElementById(
        "textoResultado"
      ).innerText = texto;


      document.getElementById(
        "resultado-container"
      ).style.display = "block";


      document.getElementById(
        "accion-container"
      ).style.display = "block";
    }


    /* =========================================================
       CAPTURAR RESULTADO
       ========================================================= */

    async function capturarResultado() {

      if (blobCapturado) {

        return blobCapturado;
      }


      if (
        typeof html2canvas ===
        "undefined"
      ) {

        throw new Error(
          "html2canvas todavía no está cargado."
        );
      }


      const area =
        document.getElementById(
          "captura-area"
        );


      const canvasCaptura =
        await html2canvas(
          area,
          {
            useCORS: true,

            allowTaint: true,

            backgroundColor:
              "#f4f4f9",

            scale:
              Math.min(
                window.devicePixelRatio || 1,
                2
              )
          }
        );


      blobCapturado =
        await new Promise(
          (resolve, reject) => {

            canvasCaptura.toBlob(
              blob => {

                if (blob) {

                  resolve(blob);

                } else {

                  reject(
                    new Error(
                      "No se pudo crear la imagen."
                    )
                  );
                }

              },
              "image/png"
            );

          }
        );


      return blobCapturado;
    }


    /* =========================================================
       ENVIAR RESULTADO
       ========================================================= */

    async function enviarResultado() {

      if (!ultimoResultado) {
        return;
      }


      const botonEnviar =
        document.getElementById(
          "btnEnviar"
        );

      botonEnviar.disabled = true;


      const textoResultado =
        document.getElementById(
          "textoResultado"
        ).innerText;


      const textoMensaje =
        `¡Hola Laura! ${textoResultado}`;


      let imagenCopiada = false;


      try {

        const blob =
          await capturarResultado();


        /*
         * Intentar copiar imagen.
         */

        if (
          blob &&
          navigator.clipboard &&
          window.ClipboardItem
        ) {

          try {

            const item =
              new ClipboardItem({
                "image/png": blob
              });


            await navigator.clipboard.write([
              item
            ]);


            imagenCopiada = true;


            document.getElementById(
              "notificacion-copiado"
            ).innerText =
              "¡Imagen copiada! Pegala en el chat de WhatsApp.";


            document.getElementById(
              "notificacion-copiado"
            ).style.display =
              "block";

          } catch (error) {

            console.log(
              "No se pudo copiar la imagen:",
              error
            );
          }
        }


        /*
         * Alternativa: descargar imagen.
         */

        if (
          !imagenCopiada &&
          blob
        ) {

          const url =
            URL.createObjectURL(blob);


          const enlace =
            document.createElement("a");


          enlace.href = url;

          enlace.download =
            "resultado_rueda.png";


          document.body.appendChild(
            enlace
          );

          enlace.click();

          document.body.removeChild(
            enlace
          );


          URL.revokeObjectURL(url);


          document.getElementById(
            "notificacion-copiado"
          ).innerText =
            "La imagen fue descargada. Adjuntala en el chat de WhatsApp.";


          document.getElementById(
            "notificacion-copiado"
          ).style.display =
            "block";
        }


      } catch (error) {

        console.error(
          "Error preparando la imagen:",
          error
        );

        alert(
          "No se pudo preparar la imagen del resultado."
        );
      }


      /*
       * Abrir WhatsApp.
       */

      setTimeout(() => {

        const urlWhatsapp =
          `https://wa.me/${NUMERO_LAURA}?text=${encodeURIComponent(textoMensaje)}`;


        window.open(
          urlWhatsapp,
          "_blank"
        );


        botonEnviar.disabled = false;

      }, 500);
    }


    /* =========================================================
       ARRANQUE
       ========================================================= */

    if (
      document.readyState ===
      "loading"
    ) {

      document.addEventListener(
        "DOMContentLoaded",
        inicializarRueda
      );

    } else {

      inicializarRueda();
    }

  </script>

</body>
</html>
