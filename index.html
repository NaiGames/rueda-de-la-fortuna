  <style>

    body {

      font-size: 22px;
      text-align: center;
      color: #2c3e50;
    }

    .rueda-container {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 10px auto;
    }

    .flecha {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid #e74c3c;
      z-index: 10;
    }

    canvas {
      display: block;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .btn-girar {
      margin-top: 25px;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #27ae60;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-girar:disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
    }

    #resultado-container {
      margin-top: 20px;
      text-align: center;
      display: none;
      background: #ffffff;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
    }

    #textoResultado {
      margin: 0;
      color: #2c3e50;
      font-size: 20px;
    }

    #accion-container {
      display: none;
      margin-top: 15px;
      width: 100%;
      max-width: 320px;
    }

    .btn-compartir {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: #25d366;
      color: #ffffff;
      border: none;
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .btn-compartir svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    /* Estilos para vista previa en iOS */
    #modal-ios {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #modal-ios img {
      max-width: 90%;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    #modal-ios p {
      color: #fff;
      font-size: 14px;
      text-align: center;
      margin-bottom: 15px;
    }

    .btn-modal {
      background: #25d366;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

      <canvas id="canvasRueda" width="320" height="320"></canvas>
    </div>
    <div id="resultado-container">
      <h2 id="textoResultado"></h2>
    </div>
  </div>

  <div id="accion-container">

      </svg>

    <p>Mantén presionada la imagen para guardarla y luego presiona el botón para ir a WhatsApp.</p>
    <a id="link-wa-ios" class="btn-modal" href="#">Ir a WhatsApp</a>
  </div>
